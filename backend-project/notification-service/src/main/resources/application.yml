server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://Postgres:5432/disastermanagement
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

app:
  rabbitmq:
    exchange: "afet_exchange"
    queues:
      notification: "notification_queue"
    routing-keys:
      notification: "notification_routingKey"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka