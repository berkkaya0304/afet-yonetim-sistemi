spring.application.name=user-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://Postgres:5432/disastermanagement
spring.datasource.username=root
spring.datasource.password=root

server.port=8081

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=dev

# This tells Hibernate how to interact with the database schema.
# 'validate' is recommended when using Liquibase for schema management
# Other options include 'validate', 'create', 'create-drop'. Use with caution in production.
spring.jpa.hibernate.ddl-auto=update

# (Optional but good practice) Specify the dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret-key=a3f54B6150645367566B5970337336763979244226452948404D635165546857
jwt.expiration=86400000

# Eureka
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
