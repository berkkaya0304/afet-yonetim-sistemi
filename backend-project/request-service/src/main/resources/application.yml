spring:
  application:
    name: request-service

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://Postgres:5432/disastermanagement
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev

server:
  port: 8082

app:
  rabbitmq:
    exchange: "afet_exchange"
    queues:
      notification: "notification_queue"
    routing-keys:
      map-update: map.update.key
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka

