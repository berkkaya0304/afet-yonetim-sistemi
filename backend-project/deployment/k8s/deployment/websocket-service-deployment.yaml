# WebSocket Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: microservices-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-service
  template:
    metadata:
      labels:
        app: websocket-service
    spec:
      containers:
        - name: websocket-service
          image: websocket-service:latest
          ports:
            - containerPort: 8086
          env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"